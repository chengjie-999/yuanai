# Alembic migration config - yuanai
# NOTE: keep this file pure ASCII - Windows configparser reads it with the
# locale encoding (GBK) and non-ASCII comments break `alembic upgrade` locally.
[alembic]
# migration scripts directory
script_location = db/migrations

# sqlalchemy.url is resolved dynamically in env.py (from utils.sensitive_data.get_mysql_config)

# logging
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# truncate long identifiers
truncate_slug_length = 40

# version table
version_table = alembic_version

# compare column types (detect type changes on autogenerate)
compare_type = true
compare_server_default = true
