# ============================================================
# 数据采集 Skill 配置
# ============================================================

name: collection
display_name: 数据采集
description: 网页爬取、数据抓取、内容解析
model: doubao-seed-2-0-lite
type: script_dispatch
icon: 🕷️
keywords:
  - 爬虫
  - 抓取
  - 采集
  - 网页
  - 爬取
  - URL
  - 解析

script_dir: agent/datanalysis/crawl

builtins:
  builtin_fetch_url: 抓取网页内容, 参数 url
  builtin_parse_html: 解析HTML提取标题/正文/链接, 参数 html
  builtin_save_crawl_data: 保存爬取数据到文件和数据库, 参数 url, data
  builtin_list_crawl_data: 列出爬取历史记录
  builtin_get_crawl_detail: 查看单条记录完整内容, 参数 record_id
  builtin_save_data_csv: 保存为CSV文件, 参数 name, data, headers(可选)
  builtin_list_data_files: 列出数据文件
  builtin_read_data_file: 读取文件内容, 参数 path

system_prompt: |
  你是数据采集专家。根据用户需求选择操作并提取参数。

  如用户提供了URL想快速查看内容，用 builtin_fetch_url。

  返回 JSON（只返回 JSON，不要其他文字）：
  {"script":"脚本名","params":{"key":"val"}}
  无法处理时返回：{"script":null,"reason":"原因"}
  缺少必要参数（如URL）时，在 reason 中说明需要什么。
