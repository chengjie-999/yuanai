# ⚠ 已废弃：前端镜像改用自包含主配置 deploy/frontend-nginx.conf
# （1.27-alpine 新版镜像 conf.d → http.d 布局变更曾导致此片段被忽略）。
# 保留仅作历史对照，勿再引用。

# 小元AI — Nginx 反向代理配置
# HTTPS 已启用，80 → 443 强制跳转

# 限流区域：API 每秒 30 请求（突发 50）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# 登录限流：每秒 5 请求（突发 10）
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# ==================== HTTPS (443) ====================
server {
    listen 443 ssl http2;
    server_name cjyuanai.cn www.cjyuanai.cn;
    client_max_body_size 20m;
    server_tokens off;

    # SSL 证书（上传到 deploy/ssl/ 目录）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（S2.1 收口到 snippets；HSTS/CSP/nosniff/XFO/Referrer/Permissions）
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理（含 WebSocket 升级支持）
    location ^~ /api/ {
        # 安装包上传（200MB 级）需要大体积请求
        client_max_body_size 300m;
        # 登录接口单独限流
        location ^~ /api/v1/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # WebSocket 端点 — 升级连接（Agent 心跳每 30s 一次，关闭 access_log 防刷爆日志）
        location ^~ /api/v1/agent/ws/ {
            limit_req zone=api_limit burst=50 nodelay;
            access_log off;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # 携带 ?token=JWT 的资产/iframe 请求（URL 会被 access_log 明文记录 → 关日志防 JWT 泄露）
        # S2.1：iframe 端点换 sandbox 头（不可有 XFO，见 snippets/sandbox-headers.conf）
        location ^~ /api/v1/planet/asset/ {
            access_log off;
            include /etc/nginx/snippets/sandbox-headers.conf;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/data/script-html/ {
            access_log off;
            include /etc/nginx/snippets/sandbox-headers.conf;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/data/analysis-html/ {
            access_log off;
            include /etc/nginx/snippets/sandbox-headers.conf;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/planet/maps/ {
            access_log off;
            include /etc/nginx/snippets/sandbox-headers.conf;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其他 API
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（防 HTML 被长缓存导致前端版本不更新）
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 静态资源强缓存（自带 add_header → 必须 include 补回安全头）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# ==================== HTTP → HTTPS 跳转（域名） ====================
server {
    listen 80;
    server_name cjyuanai.cn www.cjyuanai.cn;
    return 301 https://$host$request_uri;
}

# ==================== HTTP (80) default_server ====================
# 原「备案前 IP 直访」整站副本已删除（S2.1：无 HSTS/CSP 的旁路入口，等于绕过全部安全头）。
# IP 直访统一 301 到域名（HTTPS）。
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://cjyuanai.cn$request_uri;
}
