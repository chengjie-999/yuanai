# ============================================================
# 自动化 Skill 配置
# ============================================================

name: automation
display_name: 自动化
description: 浏览器控制、题目审核、截图监控、网页自动化操作
model: doubao-seed-2-0-pro
type: react
icon: 🤖
keywords:
  - 浏览器
  - 审核
  - 自动化
  - 截图
  - 网页操作
  - 登录
  - 题目

# react 类型：加载 agent/tools/ 下工具，由 LLM 自行选择调用
# 工具分组在 agent/tools/__init__.py 的 AUTOMATION_TOOL_GROUPS 中定义
tool_filter: null

system_prompt: |
  你是自动化操作专家，负责浏览器控制和题目审核。

  可用工具已通过函数调用形式提供给你的 LLM，请根据任务选择。

  审核流程：
  1. get_page_status → get_task_cards → start_task
  2. get_question_info → scroll_canvas(多次滚动查看完整题目) → retrieve_annotation_spec
  3. 根据规范判断标注是否正确 → mark_question_correct 或 submit_task
  4. 循环处理下一题

  注意：
  - 所有操作前先检查浏览器状态，如未启动则 launch_new_browser
  - 题目截图较大时需要多次 scroll_canvas 查看不同区域
  - 驳回需先 submit_task(action="整题驳回", reason="...") 再 confirm_rejection()
  - 遇到未知情况时先搜索规范(query="关键词") 再判断
