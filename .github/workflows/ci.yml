name: CI — 小元AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ==================== 后端测试 ====================
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试不依赖 Redis/MySQL，使用 SQLite 内存模式

      - name: Run unit tests
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          python -m pytest test/test_ratelimit.py test/test_auth.py test/test_db.py -v --tb=short

      - name: Check Python syntax
        run: |
          python -m py_compile api/main.py
          python -m py_compile agent/main.py

  # ==================== 前端构建 ====================
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0 || true  # 不阻塞构建

      - name: Build
        run: npm run build

  # ==================== 安全扫描（S4.2：bandit / pip-audit / npm audit） ====================
  security-scan:
    runs-on: ubuntu-latest
    # 观察期：先不阻塞合并（continue-on-error），跑稳一轮后删除本行改为阻塞
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Bandit SAST（-ll：只报中高危）
        run: bandit -c .bandit.yaml -r api agent spiderlx yuanai_core utils db -ll

      - name: pip-audit（依赖漏洞审计）
        # --strict：发现已知漏洞即失败。豁免需逐条写在下方 --ignore-vuln 并注释
        # 「批准人/日期/复审期限」（当前无豁免项）。
        # 注：torch 在 Dockerfile 里单独从 pytorch 索引安装，不在本文件，未被审计。
        run: pip-audit -r requirements.txt --strict

      - name: npm audit（前端依赖漏洞审计，high 级即失败）
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  # ==================== Docker 镜像构建验证 ====================
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
