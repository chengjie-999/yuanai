# Alembic 数据库迁移配置 — 小元AI
[alembic]
# 迁移脚本目录
script_location = db/migrations

# sqlalchemy.url 通过 env.py 动态获取（从 config/settings + utils/sensitive_data）
# 此处留空，由 env.py 中的 get_mysql_config() 提供

# 日志
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 截断长标识符
truncate_slug_length = 40

# 版本表
version_table = alembic_version

# 比较列类型（自动检测类型变更）
compare_type = true
compare_server_default = true
