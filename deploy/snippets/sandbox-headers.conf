# iframe 端点专用头（/api/v1/data/script-html|analysis-html、/api/v1/planet/maps|asset）——S1.2+S2.1
# 这些响应被前端同源 <iframe> 嵌入，绝不能带 X-Frame-Options: DENY（父级继承会拦死 iframe）。
# 本文件出现 add_header 即切断父级继承；内容隔离由后端响应的 CSP sandbox 头负责（双保险）。
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "sandbox allow-scripts; frame-ancestors 'self'" always;
