# 全站安全响应头（SPA 页面/静态资源用）——S2.1
# nginx 继承规则：location 一旦出现任何 add_header，父级 add_header 全部失效。
# 所以静态资源（自带 Cache-Control 头）与 /index.html 必须 include 本文件补回。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 语音通话需要麦克风；camera/geolocation 保持禁用
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# CSP 第一阶段只 Report-Only（浏览器记录违规但不拦截）：
# 语音 RTC（@volcengine/rtc SDK 的 wss/域名）与 plotly 的连通域名需浏览器 console
# 实测后补进 connect-src/script-src，观察 1-2 天无违规再切换为 Content-Security-Policy。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://cjyuanai.cn; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
