    <!-- noscript 兜底（SEO 第 5 步）：禁用 JS 的爬虫/浏览器读到真实业务介绍 -->
    <noscript>
      <div style="max-width:720px;margin:40px auto;padding:0 20px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.8">
        <h1>小元AI — 云边协同 · 多智能体协作平台</h1>
        <p>小元AI 以对话为统一入口的多智能体 AI 助手：数据分析与可视化（描述性统计、相关性、回归、RFM 客户分群、流失预测）、网页数据采集、浏览器自动化、知识库语义检索、计划任务执行。手机定计划、电脑执行——云端统筹与您电脑上的本地 Agent 协同工作。</p>
        <p>核心能力：80+ 内置工具 · 9 个分析脚本一问直调 · 多智能体协作（统筹 / 自动化 / Claude Code）· 知识星球三级知识库 · 实时语音对话。</p>

      </div>

    <!-- JS 未到达前的纯 HTML 加载壳：差网络（移动流量）下不再纯白屏；React 挂载后自动替换 -->

      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f8fafc;color:#64748b;font-size:14px">
