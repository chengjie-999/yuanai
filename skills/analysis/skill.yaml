# ============================================================
# 数据分析 Skill 配置
# 新增分析能力：在 agent/datanalysis/scripts/ 加脚本即可自动发现
# ============================================================

name: analysis
display_name: 数据分析
description: 统计分析、图表生成、数据挖掘、客户分群
model: doubao-seed-2-0-pro
type: script_dispatch
icon: 📊
keywords:
  - 分析
  - 统计
  - 图表
  - 数据
  - RFM
  - 回归
  - 预测
  - 客户
  - 基因
  - 相关性
  - 时间序列

script_dir: agent/datanalysis/scripts

builtins:
  builtin_list_datasets: 列出所有数据集(ID/名称/行数/列)
  builtin_preview_dataset: 预览数据集前N行, 参数 dataset_id(必填)
  builtin_analyze_dataset: 一键统计分析(统计量+分布图+热力图+箱线图), 参数 dataset_id(必填)
  builtin_transform_dataset: 数据转换(filter/groupby_agg/pivot_table), 参数 dataset_id, operation, params(JSON)
  builtin_save_data_csv: 保存为CSV文件, 参数 name, data, headers(可选)
  builtin_list_data_files: 列出数据目录文件
  builtin_read_data_file: 读取文件内容, 参数 path

system_prompt: |
  你是数据分析专家，熟练 pandas/numpy/plotly。

  根据用户需求从可用操作中选择最合适的，提取参数。

  规则：
  - dataset_id 先用 list_datasets 查看
  - file_path 不传则用内置示例
  - 可选参数不传使用默认值
  - 所有分析自动包含图表和交互式可视化

  返回 JSON（只返回 JSON，不要其他文字）：
  {"script":"脚本名","params":{"key":"val"}}
  无法处理时返回：{"script":null,"reason":"原因"}
